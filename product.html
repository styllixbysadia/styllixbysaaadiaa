<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product | STYLLIX BY SADIA</title>

    <link rel="icon"
          href="images/logo.png">

    <!-- CSS -->
    <link rel="stylesheet"
          href="style.css">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="top-header">

    <!-- LOGO -->

    <div class="logo-box">

        <a href="index.html">

            <img
                src="images/logo.png"
                alt="STYLLIX BY SADIA Logo"
                class="logo"
            >

        </a>


        <div class="brand-text">

            <h1>
                STYLLIX BY SADIA
            </h1>

            <p>
                Luxury Fashion Collection
            </p>

        </div>

    </div>


    <!-- HEADER ICONS -->

    <div class="header-icons">


        <!-- HOME -->

        <a
            href="index.html"
            title="Home"
            aria-label="Home"
        >

            <i class="fa-solid fa-house"></i>

        </a>


        <!-- CART -->

        <div
            id="cartIcon"
            class="cart-icon"
            role="button"
            tabindex="0"
            aria-label="Shopping Cart"
            title="Shopping Cart"
        >

            <i class="fa-solid fa-bag-shopping"></i>

            <span id="cart-count">
                0
            </span>

        </div>

    </div>

</header>



<!-- ==================================================
     NAVIGATION
================================================== -->

<nav class="navbar">

    <a href="index.html">
        Home
    </a>

    <a href="index.html#products">
        Products
    </a>

    <a href="index.html#categories">
        Categories
    </a>

    <a href="index.html#about">
        About
    </a>

    <a href="index.html#contact">
        Contact
    </a>

</nav>



<!-- ==================================================
     PRODUCT DETAIL
================================================== -->

<main class="product-detail-page">


    <div class="product-detail-card">


        <!-- PRODUCT IMAGE -->

        <div class="product-detail-image-box">

            <img
                id="productImage"
                src="images/logo.png"
                alt="Product"
            >

        </div>



        <!-- PRODUCT INFORMATION -->

        <div class="product-detail-info">


            <!-- BADGE -->

            <span
                id="productBadge"
                class="badge"
            >

                NEW

            </span>



            <!-- PRODUCT NAME -->

            <h1 id="productName">

                Product Name

            </h1>



            <!-- RATING -->

            <div
                id="productRating"
                class="rating"
            >

                ⭐⭐⭐⭐⭐

            </div>



            <!-- PRICE -->

            <div
                id="productPrice"
                class="price"
            >

                Rs. 0

            </div>



            <!-- DESCRIPTION -->

            <p id="productDescription">

                Product description

            </p>



            <!-- QUANTITY -->

            <div class="quantity-box">


                <strong>
                    Quantity:
                </strong>


                <button
                    id="minusBtn"
                    type="button"
                    aria-label="Decrease quantity"
                >

                    −

                </button>


                <span id="quantity">

                    1

                </span>


                <button
                    id="plusBtn"
                    type="button"
                    aria-label="Increase quantity"
                >

                    +

                </button>


            </div>



            <!-- BUTTONS -->

            <div class="detail-buttons">


                <!-- ADD TO CART -->

                <button
                    id="addToCartBtn"
                    class="cart-btn"
                    type="button"
                >

                    <i class="fa-solid fa-cart-shopping"></i>

                    Add To Cart

                </button>



                <!-- WHATSAPP -->

                <button
                    id="whatsappBtn"
                    class="whatsapp-btn"
                    type="button"
                >

                    <i class="fab fa-whatsapp"></i>

                    Order on WhatsApp

                </button>


            </div>



            <!-- CONTINUE SHOPPING -->

            <a
                href="index.html#products"
                class="continue-shopping"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Continue Shopping

            </a>


        </div>

    </div>

</main>



<!-- ==================================================
     CART SIDEBAR
================================================== -->

<div
    id="cartSidebar"
    class="cart-sidebar"
>


    <!-- CART HEADER -->

    <div class="cart-header">


        <h2>
            Your Cart
        </h2>


        <button
            id="closeCart"
            type="button"
            aria-label="Close Cart"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


    </div>



    <!-- CART ITEMS -->

    <div
        id="cartItems"
        class="cart-items"
    >

        <p class="empty-cart">

            Your cart is empty.

        </p>

    </div>



    <!-- CART FOOTER -->

    <div class="cart-footer">


        <h3>

            Total:

            <span id="cartTotal">

                Rs. 0

            </span>

        </h3>



        <!-- CHECKOUT -->

        <button
            id="checkoutBtn"
            class="whatsapp-btn"
            type="button"
        >

            <i class="fab fa-whatsapp"></i>

            Order on WhatsApp

        </button>


    </div>

</div>



<!-- ==================================================
     CART OVERLAY
================================================== -->

<div
    id="cartOverlay"
    class="cart-overlay"
>
</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script src="script.js"></script>


</body>

</html>
